name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install setuptools wheel pytest
      - run: python scripts/build_legacy_wheel.py --out dist
      - run: python -m pip install dist/gapms-0.3.0-py3-none-any.whl .
      - run: python -m pytest -q
