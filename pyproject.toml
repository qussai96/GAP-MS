[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gapms-v1"
version = "1.0.0"
description = "Peptide-centric genome mapping and auditable annotation refinement"
readme = "docs/v1/README.md"
requires-python = ">=3.10,<3.11"
authors = [{name = "Qussai Abbas", email = "qussai.abbas@tum.de"}]
license = {text = "MIT"}
dependencies = ["gapms==0.3.0"]

[project.scripts]
gapms-v1 = "gapms_v1.cli:main"

[tool.setuptools.packages.find]
include = ["gapms_v1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["gapms_sandbox", "dist", "build"]
